name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: pip install -r apps/api/requirements-dev.txt
      - run: pytest -q
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: apps/web
      - run: cp .env.example .env && docker compose config --quiet
